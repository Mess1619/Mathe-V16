const CITYKEY='mathe-city-final-v6';const CM={power:{name:'Stromausfall',icon:'⚡',need:25,reward:250,xp:80,vehicle:'City Mini'},tow:{name:'Pannenhilfe',icon:'🚚',need:25,reward:400,xp:120,vehicle:'Abschleppwagen'},rescue:{name:'Luftrettung',icon:'🚁',need:25,reward:550,xp:160,vehicle:'Rescue Heli'},race:{name:'City-Rennen',icon:'🏁',need:40,reward:700,xp:200,vehicle:'Turbo GT'}};function cityFresh(){return{activeMission:'power',progress:{},credits:0,xp:0,runs:{},owned:['City Mini'],activeVehicle:'City Mini'}}function cityLoad(){try{return{...cityFresh(),...(JSON.parse(localStorage.getItem(CITYKEY))||{})}}catch{return cityFresh()}}function citySave(z){localStorage.setItem(CITYKEY,JSON.stringify(z));window.dispatchEvent(new Event('mathe-city-update'));return z}function cityCorrect(){let z=cityLoad(),id=z.activeMission||'power',m=CM[id]||CM.power,p=z.progress?.[id]||0,n=p+1;if(n<m.need){citySave({...z,activeMission:id,progress:{...z.progress,[id]:n}});return{advanced:true,completed:false}}let runs={...z.runs,[id]:(z.runs?.[id]||0)+1},owned=[...z.owned];if(id==='tow'&&!owned.includes('Rescue Heli'))owned.push('Rescue Heli');citySave({...z,credits:z.credits+m.reward,xp:z.xp+m.xp,runs,owned,activeMission:id,progress:{...z.progress,[id]:0}});return{advanced:true,completed:true,reward:m.reward,xp:m.xp}}window.cityCorrect=cityCorrect;function MissionMini(){const[z,setZ]=useState(cityLoad());useEffect(()=>{let h=()=>setZ(cityLoad());window.addEventListener('mathe-city-update',h);return()=>window.removeEventListener('mathe-city-update',h)},[]);let id=z.activeMission||'power',m=CM[id],p=z.progress?.[id]||0;return <div className="w-20 rounded-xl bg-amber-200 px-2 py-1 text-center"><div className="text-xs font-black">{m.icon} {p}/{m.need}</div><div className="mt-1 h-1.5 overflow-hidden rounded-full bg-amber-100"><div className="h-full bg-green-500" style={{width:`${p/m.need*100}%`}}/></div></div>}function MatheCity(){const[z,setZ]=useState(cityLoad()),[view,setView]=useState('jobs') ew==='jobs'&&<div className="mt-3 space-y-2">{Object.entries(CM).map(([id,m])=>{let pr=z.progress?.[id]||0,owned=z.owned.includes(m.vehicle),vok=z.activeVehicle===m.vehicle,active=z.activeMission===id;return <div key={id} className={`rounded-xl p-3 ${active?'bg-slate-600 ring-2 ring-amber-300':'bg-slate-700'}`}><div className="mb-2 rounded-xl bg-slate-800 p-2 text-center text-3xl">{scene(id,pr)}</div><div className="flex justify-between"><b>{m.name}</b>{active&&<span className="rounded-full bg-amber-300 px-2 py-1 text-xs font-black text-slate-900">AKTIV</span>}</div><small>{pr}/{m.need} · {m.vehicle}</small><div className="my-2 h-2 overflow-hidden rounded-full bg-slate-500"><div className="h-full bg-green-400" style={{width:`${pr/m.need*100}%`}}/></div>{!owned?<button disabled className="rounded-lg bg-slate-500 px-3 py-1 opacity-60">🔒 {m.vehicle} fehlt</button>:!vok?<button onClick={()=>setView('garage')} className="rounded-lg bg-sky-200 px-3 py-1 font-bold text-slate-900">{m.vehicle} aktivieren</button>:active?<span className="text-xs text-amber-200">Diese Mission ist aktiv.</span>:<button onClick={()=>activate(id)} className="rounded-lg bg-white px-3 py-1 font-bold text-slate-900">Hier weitermachen</button>}</div>})}</div>}{view==='garage'&&<div className="mt-3 space-y-2">{[['City Mini','🚙',0],['Abschleppwagen','🚚',600],['Rescue Heli','🚁',0],['Turbo GT','🏎️',900]].map(([name,icon,price])=>{let owned=z.owned.includes(name),active=z.activeVehicle===name;return <div key={name} className={`rounded-xl p-3 ${active?'bg-slate-600 ring-2 ring-amber-300':'bg-slate-700'}`}><b>{icon} {name}</b>{name==='Abschleppwagen'&&<div className="text-amber-300">Level {towLevel}/6 · {stars}</div>}{owned?<button onClick={()=>choose(name)} className="ml-2 rounded-lg bg-white px-2 py-1 font-bold text-slate-900">{active?'Aktiv':'Wählen'}</button>:name==='Rescue Heli'?<span className="ml-2 text-xs">🔒 nach Pannenmission</span>:<button onClick={()=>buy(name,price)} disabled={z.credits<price} className="ml-2 rounded-lg bg-amber-300 px-2 py-1 font-bold text-slate-900 disabled:opacity-40">{price} Credits</button>}</div>})}</div>}{view==='career'&&<div className="mt-3 space-y-2">{Object.entries(CM).map(([id,m])=><div key={id} className="rounded-xl bg-slate-700 p-3">{m.name}: {z.runs?.[id]||0}× geschafft</div>)}</div>}</section>}

function App(){const[tab,setTab]=useState('learn'),[mode,setMode]=useState(()=>localStorage.getItem('mathe-last-mode')||'add'),[digits,setDigits]=useState(3),[ma,setMa]=useState(3),[mb,setMb]=useState(2),[a,setA]=useState(347),[b,setB]=useState(26),[msg,setMsg]=useState('');const make=(m=mode,d=digits)=>{let x=num(d),y=num(d);if(m==='sub'&&y>x)[x,y]=[y,x];if(m==='div'){y=rand(2,9);x=num(d)}setA(x);setB(y);setMsg('')},makeMul=(da=ma,db=mb)=>{setA(num(da));setB(num(db));setMsg('')},reward=()=>{cityCorrect();setMsg('Richtig!')};return <div className="min-h-screen bg-slate-200 p-2"><div className="mx-auto min-h-[820px] max-w-[430px] space-y-4 rounded-[32px] border-[7px] border-slate-900 bg-gradient-to-b from-sky-100 to-emerald-50 p-3 pb-24"><header className="flex justify-between"><div><h1 className="text-2xl font-black">Mathe-Abenteuer</h1><p className="text-xs">Schriftlich rechnen und Mathe City entwickeln.</p></div><MissionMini/></header>{tab==='learn'?<><section className="rounded-2xl bg-white p-4"><select value={mode} onChange={e=>{let m=e.target.value;setMode(m);localStorage.setItem('mathe-last-mode',m);m==='mul'?makeMul():make(m,digits)}} className="w-full rounded-xl border p-3 font-bold">{OPS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select>{mode==='mul'?<div className="mt-3 space-y-2"><div><b className="text-xs">1. Zahl</b><div className="grid grid-cols-4 gap-1">{[2,3,4,5].map(d=><button key={d} onClick={()=>{setMa(d);makeMul(d,mb)}} className={`rounded-xl border p-2 ${ma===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div></div><div><b className="text-xs">2. Zahl</b><div className="grid grid-cols-3 gap-1">{[1,2,3].map(d=><button key={d} onClick={()=>{setMb(d);makeMul(ma,d)}} className={`rounded-xl border p-2 ${mb===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div></div></div>:<div className="mt-3 grid grid-cols-4 gap-1">{[2,3,4,5].map(d=><button key={d} onClick={()=>{setDigits(d);make(mode,d)}} className={`rounded-xl border p-2 ${digits===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div>}</section><section className="rounded-2xl bg-white p-4"><div className="mb-4 flex justify-between"><b>Schriftlich rechnen</b><button onClick={()=>mode==='mul'?makeMul():make(mode,digits)} className="rounded-xl border px-3 py-2">Neue Aufgabe</button></div>{mode==='mul'?<Multiply a={a} b={b} reward={reward}/>:mode==='div'?<Division a={a} b={b}/>:<AddSub mode={mode} a={a} b={b} reward={reward}/>}<div className="mt-2 text-center font-bold">{msg}</div></section></>:<MatheCity/>}<nav className="fixed bottom-0 left-1/2 z-40 w-full max-w-[430px] -translate-x-1/2 rounded-b-[32px] border-x-[7px] border-b-[7px] border-slate-900 bg-slate-900 p-2 pb-[calc(8px+env(safe-area-inset-bottom))]"><div className="grid grid-cols-2 gap-2"><button onClick={()=>setTab('learn')} className={`w-full rounded-xl p-3 font-bold ${tab==='learn'?'bg-amber-300 text-slate-900':'bg-slate-700 text-white'}`}>✏️ Lernen</button><button onClick={()=>setTab('planet')} className={`w-full rounded-xl p-3 font-bold ${tab==='planet'?'bg-amber-300 text-slate-900':'bg-slate-700 text-white'}`}>🏙️ Mathe City</button></div></nav></div></div>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}</script></body></html>
